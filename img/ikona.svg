<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0a3d4a"/>
    </linearGradient>
    <filter id="softC" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgC)"/>

  <!-- sound bars -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="176" y="150" width="16" height="70" rx="8"/>
    <rect x="210" y="118" width="16" height="134" rx="8"/>
    <rect x="244" y="100" width="16" height="170" rx="8"/>
    <rect x="278" y="128" width="16" height="114" rx="8"/>
    <rect x="312" y="150" width="16" height="70" rx="8"/>
  </g>

  <!-- keyboard base -->
  <rect x="96" y="292" width="320" height="140" rx="20" fill="#ffffff"/>

  <!-- glows under the three chord keys -->
  <g filter="url(#softC)" opacity="0.6">
    <rect x="118" y="292" width="42" height="140" rx="8" fill="#ff5e5b"/>
    <rect x="235" y="292" width="42" height="140" rx="8" fill="#2ec4e6"/>
    <rect x="352" y="292" width="42" height="140" rx="8" fill="#a66bff"/>
  </g>

  <!-- lit chord keys -->
  <rect x="121" y="296" width="36" height="132" rx="7" fill="#ff5e5b"/>
  <rect x="238" y="296" width="36" height="132" rx="7" fill="#2ec4e6"/>
  <rect x="355" y="296" width="36" height="132" rx="7" fill="#a66bff"/>

  <!-- key separators -->
  <g stroke="#c8cede" stroke-width="4">
    <line x1="141" y1="300" x2="141" y2="424"/>
    <line x1="186" y1="300" x2="186" y2="424"/>
    <line x1="231" y1="300" x2="231" y2="424"/>
    <line x1="281" y1="300" x2="281" y2="424"/>
    <line x1="326" y1="300" x2="326" y2="424"/>
    <line x1="371" y1="300" x2="371" y2="424"/>
  </g>

  <!-- black keys -->
  <g fill="#13202b">
    <rect x="128" y="292" width="26" height="80" rx="6"/>
    <rect x="173" y="292" width="26" height="80" rx="6"/>
    <rect x="300" y="292" width="26" height="80" rx="6"/>
    <rect x="345" y="292" width="26" height="80" rx="6"/>
  </g>
</svg>
